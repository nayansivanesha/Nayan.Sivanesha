<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nayan Talekar Foundation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --primary: #1e3a8a;
    --secondary: #3b82f6;
    --accent: #10b981;
    --dark: #0f172a;
    --gray-900: #0f172a; /* ✅ FIXED */
}

body {
    font-family: sans-serif;
}

/* NAVBAR FIX */
.navbar {
    background: rgba(255,255,255,0.95);
}

/* HERO */
.hero {
    height: 100vh;
    position: relative;
    overflow: hidden;
}

.hero-video-container {
    position: absolute;
    width: 100%;
    height: 100%;
}

.hero-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ANIMATION FIX */
.animate {
    opacity: 0;
}

.animate.show {
    animation: fadeInUp 0.8s ease forwards;
}

@keyframes fadeInUp {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

/* FOOTER FIX */
.footer {
    background: var(--gray-900);
    color: white;
    padding: 40px 0;
}

/* NAVBAR TOGGLER FIX */
.navbar-toggler {
    border: none;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top navbar-light"> <!-- ✅ FIX -->
<div class="container">
<a class="navbar-brand" href="#">NT Foundation</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
<li class="nav-item"><a class="nav-link" href="#about">About</a></li>
<li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
</ul>
</div>
</div>
</nav>

<!-- HERO -->
<section id="home" class="hero">

<div class="hero-video-container">
<video class="hero-video" autoplay muted loop playsinline>
<source src="homepage.mp4" type="video/mp4">
</video>
</div>

<div class="container h-100 d-flex justify-content-center align-items-center">
<h1 class="text-white animate">Empowering Rural India</h1>
</div>

</section>

<!-- STATS -->
<section class="stats-section text-center py-5">
<div class="container">
<span class="stat-number" data-target="100">0</span>
</div>
</section>

<!-- FOOTER -->
<footer class="footer text-center">
<p id="footer-text">© 2024</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* NAVBAR SCROLL */
window.addEventListener('scroll', () => {
document.querySelector('.navbar')
.classList.toggle('scrolled', window.scrollY > 50);
});

/* ✅ SMOOTH SCROLL FIX */
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
anchor.addEventListener('click', function(e) {
const id = this.getAttribute('href');

if (id === "#" || !document.querySelector(id)) return;

e.preventDefault();

document.querySelector(id).scrollIntoView({
behavior: 'smooth'
});
});
});

/* ✅ VIDEO AUTOPLAY FIX */
const heroVideo = document.querySelector('.hero-video');
if (heroVideo) {
heroVideo.play().catch(() => console.log("Autoplay blocked"));
}

/* ✅ COUNTER FIX */
let statsAnimated = false;

function animateCounters() {
if (statsAnimated) return;
statsAnimated = true;

document.querySelectorAll('.stat-number').forEach(counter => {
const target = +counter.dataset.target;
let count = 0;

const update = () => {
if (count < target) {
count += target / 100;
counter.innerText = Math.floor(count);
requestAnimationFrame(update);
} else {
counter.innerText = target;
}
};

update();
});
}

/* TRIGGER COUNTER */
const statsObserver = new IntersectionObserver(entries => {
entries.forEach(entry => {
if (entry.isIntersecting) {
animateCounters();
}
});
});

statsObserver.observe(document.querySelector('.stats-section'));

/* ✅ ANIMATION FIX */
const observer = new IntersectionObserver(entries => {
entries.forEach(entry => {
if (entry.isIntersecting) {
entry.target.classList.add('show');
}
});
});

document.querySelectorAll('.animate').forEach(el => observer.observe(el));

/* ✅ FOOTER YEAR AUTO */
document.getElementById("footer-text").innerText =
"© " + new Date().getFullYear() + " Nayan Talekar Foundation";

</script>

</body>
</html>
