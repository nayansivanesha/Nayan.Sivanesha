<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S. Nayan Talekar - Navigation Header</title>
  <style>
    /* Global Styles & Variables */
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --text-dark: #1f2937;
      --text-muted: #4b5563;
      --bg-header: rgba(255, 255, 255, 0.85);
      --border-color: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      color: var(--text-dark);
      padding-top: 80px; /* Offset for fixed header */
    }

    /* Navigation Header */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: var(--bg-header);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
    }

    /* Logo */
    .nav-logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    /* Nav Links List */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
    }

    /* Links & Animated Underline Effect */
    .nav-link {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      position: relative;
      padding: 0.25rem 0;
      transition: color 0.2s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: var(--primary-color);
      transition: width 0.3s ease-in-out;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--primary-color);
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    /* Contact CTA Button Style */
    .nav-btn-cta {
      background-color: var(--primary-color);
      color: #ffffff !important;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-btn-cta::after {
      display: none;
    }

    .nav-btn-cta:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* Hamburger Menu Toggle (Mobile) */
    .nav-hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 5px;
    }

    .bar {
      width: 25px;
      height: 3px;
      background-color: var(--text-dark);
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Mobile Responsive Rules */
    @media (max-width: 768px) {
      .nav-hamburger {
        display: flex;
      }

      .nav-menu {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        flex-direction: column;
        gap: 1.5rem;
        padding: 2rem 0;
        box-shadow: var(--shadow-md);
        transform: translateY(-150%);
        opacity: 0;
        visibility: hidden;
        transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
      }

      /* Animated Hamburger Icon to X */
      .nav-hamburger.active .bar:nth-child(1) {
        transform: translateY(8px) rotate(45deg);
      }

      .nav-hamburger.active .bar:nth-child(2) {
        opacity: 0;
      }

      .nav-hamburger.active .bar:nth-child(3) {
        transform: translateY(-8px) rotate(-45deg);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="navbar">
      <a href="#home" class="nav-logo">Nayan Sivanesha</a>

      <ul class="nav-menu" id="navMenu">
        <li class="nav-item"><a href="#home" class="nav-link active">Home</a></li>
        <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
        <li class="nav-item"><a href="#vision" class="nav-link">Vision</a></li>
        <li class="nav-item"><a href="#work" class="nav-link">Work</a></li>
        <li class="nav-item nav-cta-item">
          <a href="#contact" class="nav-link nav-btn-cta">Contact Us</a>
        </li>
      </ul>

      <button class="nav-hamburger" id="hamburgerBtn" aria-label="Toggle Navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </nav>
  </header>

  <script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');

    // Mobile Toggle Menu
    hamburgerBtn.addEventListener('click', () => {
      hamburgerBtn.classList.toggle('active');
      navMenu.classList.toggle('active');
    });

    // Close mobile menu on selecting any link
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburgerBtn.classList.remove('active');
        navMenu.classList.remove('active');
      });
    });
  </script>

</body>
</html>
