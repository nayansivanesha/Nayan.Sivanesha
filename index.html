    <meta name="description" content="Nayan Talekar Foundation - Transforming rural India through sustainable agriculture, water management, and community empowerment.">

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #1e40af;
            --secondary: #3b82f6;
            --accent: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --white: #ffffff;
            --gray-50: #f1f5f9;
            --gray-100: #f3f4f6;
            --gray-800: #1e293b;
            --gray-900: #111827; /* ✅ FIXED: Missing variable */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--gray-800);
            overflow-x: hidden;
        }

        /* Header - SAME */
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 1rem 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .navbar.scrolled {
            padding: 0.5rem 0;
            background: rgba(255, 255, 255, 1) !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        .navbar-brand img {
            width: 50px; height: 50px; border-radius: 12px; object-fit: cover;
        }

        .nav-link {
            font-weight: 500; color: var(--gray-800) !important;
            margin: 0 8px; padding: 8px 16px !important;
            border-radius: 8px; transition: all 0.2s;
        }

        .nav-link:hover {
            color: var(--primary) !important; background: var(--gray-50);
        }

        /* Hero Section - OPTIMIZED */
        .hero {
            min-height: 100vh; position: relative;
            display: flex; align-items: center; overflow: hidden;
        }

        .hero-video-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1; overflow: hidden;
        }

        .hero-video {
            width: 100vw; height: 100vh;
            object-fit: cover; object-position: center;
        }

        .hero-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.7) 0%, rgba(59, 130, 246, 0.6) 50%, rgba(16, 185, 129, 0.5) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative; z-index: 3; text-align: center; color: white;
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 800;
            margin-bottom: 1.5rem; line-height: 1.1;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .hero-content .lead {
            font-size: 1.25rem; color: rgba(255,255,255,0.95);
            margin-bottom: 2.5rem; max-width: 600px;
            margin-left: auto; margin-right: auto;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .btn-primary-custom {
            background: var(--white); color: var(--primary); border: none;
            padding: 16px 40px; font-weight: 600; border-radius: 50px;
            font-size: 1.1rem; box-shadow: 0 10px 30px rgba(255,255,255,0.3);
            transition: all 0.3s ease; text-decoration: none; display: inline-block;
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(255,255,255,0.4);
            color: var(--primary); text-decoration: none;
        }

        /* Rest of CSS - SAME (shortened for brevity) */
        .stats-section { background: var(--white); padding: 4rem 0; position: relative; }
        .stat-item { text-align: center; padding: 2rem 0; }
        .stat-number {
            font-size: 3.5rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; display: block;
        }
        .content-section { padding: 8rem 0; }
        .section-title { font-size: 2.5rem; font-weight: 700; color: var(--dark); margin-bottom: 1rem; text-align: center; }
        .section-subtitle { font-size: 1.25rem; color: var(--gray-800); text-align: center; max-width: 600px; margin: 0 auto 4rem; }
        
        .feature-card {
            background: var(--white); border-radius: 20px; padding: 2.5rem;
            text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            transition: all 0.4s ease; height: 100%; border: 1px solid var(--gray-100);
        }
        .feature-card:hover { transform: translateY(-12px); box-shadow: 0 30px 60px rgba(0,0,0,0.15); }
        .feature-icon {
            width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; font-size: 2rem; color: white;
        }
        
        .quote-section { background: linear-gradient(135deg, var(--gray-50) 0%, var(--light) 100%); padding: 8rem 0; }
        .quote-text { font-size: 1.5rem; font-style: italic; color: var(--gray-800); text-align: center; max-width: 800px; margin: 0 auto 2rem; line-height: 1.8; }
        .quote-author { font-weight: 600; color: var(--primary); text-align: center; font-size: 1.1rem; }
        
        .contact-section { background: var(--dark); color: white; padding: 8rem 0; }
        .contact-card {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3rem;
            text-align: center; transition: all 0.3s ease;
        }
        .contact-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); }
        
        .footer { background: var(--gray-900); color: white; padding: 4rem 0 2rem; }
        .footer-link { color: rgba(255,255,255,0.8); text-decoration: none; transition: color 0.2s; }
        .footer-link:hover { color: var(--secondary); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate { opacity: 0; animation: fadeInUp 0.8s ease forwards; }

        @media (max-width: 768px) {
            .content-section, .quote-section { padding: 4rem 0; }
            .section-title { font-size: 2rem; }
            .stat-number { font-size: 2.5rem; }
        }

        .scroll-indicator {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); color: white;
            animation: bounce 2s infinite; z-index: 3;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        /* Mobile video fix */
        @media (max-width: 768px) {
            .hero-video { object-fit: cover; object-position: center top; }
        }
    </style>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 50);
        });

        // Smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // ✅ Video optimization
        const heroVideo = document.querySelector('.hero-video');
        if (heroVideo) {
            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        heroVideo.play().catch(e => console.log('Autoplay prevented'));
                    } else {
                        heroVideo.pause();
                    }
                });
            }, { threshold: 0.1 });
            videoObserver.observe(heroVideo);
        }

        // Stats counter + animations (your original code)
        function animateCounters() {
            const counters = document.querySelectorAll('.stat-number');
            counters.forEach(counter => {
                const target = parseInt(counter.getAttribute('data-target'));
                const increment = target / 100;
                let current = 0;
                const updateCounter = () => {
                    if (current < target) {
                        current += increment;
                        counter.textContent = Math.floor(current);
                        requestAnimationFrame(updateCounter);
                    } else {
                        counter.textContent = target;
                    }
                };
                updateCounter();
            });
        }

        const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('animate');
            });
        }, observerOptions);

        document.querySelectorAll('.animate').forEach(el => observer.observe(el));

        const statsObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    animateCounters();
                    statsObserver.unobserve(entry.target);
                }
            });
        });
        statsObserver.observe(document.querySelector('.stats-section'));
    </script>
